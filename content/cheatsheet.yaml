    kind: official
    checked: 2026-10-20
    status: available
    product: intel/llm-scaler-vllm container
    version: README as of check date
    facts:
      - Use an exact release tag; do NOT use the latest tag.
      - docker run with --privileged --net=host --device=/dev/dri --shm-size=32g; users need video and render groups.
      - Example serve flags include --dtype=float16, --enforce-eager, --block-size 64, --gpu-memory-util=0.9, -tp=1, --quantization fp8 or sym_int4.
