  - id: lab-correctness-check
    title: Correctness check with a tolerance
    label: Runs on a normal laptop
    minutes: 10
    lesson: install-smoke-correctness
    objective: Compare a reference and a lower-precision candidate on fixed inputs.
    steps:
      - Choose the candidate precision and the tolerance, then click Run.
      - The lab computes a small fixed matrix-vector product in FP64 (reference) and in the candidate precision.
    code: |
      import numpy as np
      rng = np.random.default_rng(1)
      w, x = rng.normal(size=(256, 256)), rng.normal(size=256)
      ref = w @ x
      cand = (w.astype(np.float16) @ x.astype(np.float16)).astype(np.float64)
      print(np.abs(ref - cand).max())
    runner: correctness_check
    expected: Measured in-app max absolute difference and PASS/FAIL against your tolerance.
    interpretation: Agree tolerances with the customer before testing.

