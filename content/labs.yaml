    interpretation: Real counts depend on the model's tokenizer. Use the customer's tokenizer for POC numbers.

  - id: lab-latency-percentiles
    title: Latency percentiles from real timings
    label: Runs on a normal laptop
    minutes: 10
    lesson: latency-throughput-metrics
    objective: Compute mean, P50, P95, P99 from repeated measurements.
    steps:
      - Choose the number of runs and click Run. The lab times a small Python function repeatedly.
      - Look at the histogram and the gap between P50 and P99.
    code: |
      import time
      times = []
      for _ in range(200):
          t = time.perf_counter(); sum(i*i for i in range(20000)); times.append(time.perf_counter() - t)
    runner: latency_percentiles
    expected: Measured in-app. Tail percentiles are higher than the median; the exact values depend on the machine.
    interpretation: Report percentiles, not just averages. Investigate large P99/P50 gaps.

  - id: lab-warmup
    title: Warm-up effect
    label: Runs on a normal laptop
    minutes: 5
    lesson: measurement-hygiene
    objective: See why first runs are slower and must be reported separately.
    steps:
      - Click Run. The function builds a lookup table on first call (like a compile or allocation step), then reuses it.
    code: |
      import functools, time
      @functools.lru_cache
      def table(n): return [i*i for i in range(n)]
      for i in range(5):
          t = time.perf_counter(); table(2_000_000); print(i, time.perf_counter() - t)
    runner: warmup
    expected: Measured in-app. Call 1 is much slower than calls 2-5.
    interpretation: Exclude warm-up from steady-state numbers; report cold start separately when it matters.

