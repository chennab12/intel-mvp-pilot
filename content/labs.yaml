    objective: See how communication overhead limits multi-device speed-up.
    steps:
      - Move the communication fraction slider and the device count. The chart updates.
    code: |
      def speedup(n, comm):
          return 1 / ((1 / n) * (1 - comm) + comm * (n > 1))
    runner: scaling_efficiency
    expected: Simulated curve. Not a measurement of any product.
    interpretation: Even modest communication overhead flattens scaling; measure communication time on real systems.

