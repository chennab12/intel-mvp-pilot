# Practical Labs.
# label: "Runs on a normal laptop" | "Simulation only" | "Requires specified Intel hardware"
# runner: name of a safe, predefined function in utils/labs.py that the app can run in-process.
#         The app never executes text typed by users and never runs shell commands.
# link:   another app section that hosts the interactive part (for simulation labs).
labs:
  - id: lab-system-inventory
    title: What processors does this machine have?
    label: Runs on a normal laptop
    minutes: 10
    lesson: cpu-gpu-npu-accelerator
    objective: Read basic CPU information the way an engineer would, and learn which commands to ask a customer for.
    steps:
      - Click Run to see what Python can report about the machine running this app.
      - Then run the commands below on your own laptop (Linux/WSL) and compare.
    code: |
      lscpu | head -20
      lspci | grep -i -E "vga|display|3d|processing"
    runner: system_inventory
    expected: The in-app run reports the OS, machine architecture and logical CPU count of the machine running this app (your laptop if you run locally, the hosting server if you use a hosted copy).
    interpretation: Logical CPUs count hardware threads, not cores. GPUs and NPUs need OS tools (Task Manager, lspci) to list.

  - id: lab-environment-inventory
    title: Capture an environment inventory
    label: Runs on a normal laptop
    minutes: 10
    lesson: poc-readiness-inventory
    objective: Produce the version record that makes results reproducible.
    steps:
      - Click Run to capture OS, Python and key package versions.
      - Download the inventory as JSON and paste the values into Senior TPM Toolkit > Environment inventory.
    code: |
      import platform, sys
      from importlib.metadata import version
      print(platform.platform(), sys.version.split()[0])
      for p in ["numpy", "pandas", "streamlit", "plotly", "PyYAML"]:
          print(p, version(p))
    runner: environment_inventory
    expected: A table of package versions measured from the running app's environment.
    interpretation: On a real POC add hardware, firmware, driver, runtime, framework, serving engine and container digest rows.

  - id: lab-bandwidth-vs-compute
    title: Memory bandwidth vs compute
    label: Runs on a normal laptop
    minutes: 10
    lesson: memory-types-bandwidth
    objective: See a memory-bound and a compute-bound operation on the same machine.
    steps:
      - Choose an array size and click Run. The lab times an array copy and a matrix multiply with NumPy.
      - Compare GB/s (copy) with GFLOP/s (matmul).
    code: |
      import numpy as np, time
      a = np.ones(25_000_000, dtype=np.float32)
      t = time.perf_counter(); b = a.copy(); dt = time.perf_counter() - t
      print("copy GB/s", 2 * a.nbytes / 1e9 / dt)
      m = np.random.rand(1024, 1024).astype(np.float32)
      t = time.perf_counter(); m @ m; dt = time.perf_counter() - t
      print("matmul GFLOP/s", 2 * 1024**3 / 1e9 / dt)
    runner: bandwidth_vs_compute
    expected: Measured values vary by machine. The matmul's GFLOP/s is usually far higher than the copy's GB/s, because matmul reuses each byte many times.
    interpretation: Low arithmetic intensity (copy) is limited by memory; high intensity (matmul) by compute. LLM decode is closer to the copy case.

  - id: lab-quantization-error
    title: Quantization error
    label: Runs on a normal laptop
    minutes: 10
    lesson: tensors-precision-quantization
    objective: Measure memory savings and error from INT8 and 4-bit style rounding.
    steps:
      - Click Run. The lab quantizes a fixed random array (seed 0) per-tensor and reports size and mean absolute error.
      - Turn on the outlier channels, then switch to per-channel scaling and compare the error.
    code: |
      import numpy as np
      x = np.random.default_rng(0).normal(size=100_000).astype(np.float32)
      scale = np.abs(x).max() / 127
      q = np.round(x / scale).astype(np.int8)
      print(x.nbytes, q.nbytes, np.abs(q * scale - x).mean())
    runner: quantization_error
    expected: "Measured in-app with seed 0: FP32 400,000 bytes, INT8 100,000 bytes, INT8 mean error ~0.009; 4-bit error is larger."
    interpretation: Small numeric error can still change model answers. Only the model's own evaluation can tell you if it matters.

  - id: lab-token-counting
    title: Token counting and prompt growth
    label: Runs on a normal laptop
