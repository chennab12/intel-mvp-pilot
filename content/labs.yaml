  - id: lab-hw-xpu-check
    title: Confirm PyTorch sees an Intel GPU
    label: Requires specified Intel hardware
    hardware: Intel GPU listed on the PyTorch "Getting Started on Intel GPU" page (for example Arc B-Series), with the Intel GPU driver installed, on Linux or Windows
    minutes: 20
    lesson: tracing-software-stack
    objective: Run the official smoke test for the PyTorch XPU backend.
    steps:
      - Install the Intel GPU driver following Intel's guide for your GPU and OS.
      - Install PyTorch from the XPU wheel index.
      - Run the availability check.
    code: |
      pip3 install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/xpu
      python -c "import torch; print(torch.xpu.is_available())"
    runner: null
    expected: "Illustrative (not executed by this app): True. If False, the PyTorch docs advise double-checking the GPU driver installation."
    interpretation: Device visibility is a smoke test only; run correctness and accuracy next.

