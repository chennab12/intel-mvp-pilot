# Intel Product Explorer. Only facts present in the cited sources appear here.
# status: available | announced | historical | deprecated | unverified
# category: CPU | GPU | AI accelerator | Client SoC | Networking | Software
products:
  - id: xeon-6
    name: Intel Xeon 6 processors (P-core SKUs, formerly Granite Rapids)
    category: CPU
    segment: Data center
    status: available
    example_sku: Intel Xeon 696X
    key_facts:
      - "Xeon 696X (ARK): 64 P-cores / 128 threads, 336 MB cache, 350 W TDP."
      - "Memory: DDR5-6400 or MRDIMM-8000, 8 channels (Xeon 696X)."
      - "PCIe 5.0, 128 lanes (Xeon 696X)."
      - "Intel AMX: Yes; AVX-512: Yes (Xeon 696X)."
    ai_role: Host CPU for accelerator servers; CPU inference with AMX for suitable workloads; retrieval, pre/post-processing.
    software: [PyTorch (CPU), OpenVINO CPU device, oneDNN]
    tpm_notes: Specs vary by SKU; always look up the exact SKU on ARK. Record NUMA layout and memory population in every CPU benchmark.
    caveats: Vendor MRDIMM bandwidth claims on the solution brief don't name configurations; treat as claims.
    sources: [ark-xeon-696x, intel-amx-overview, intel-xeon6-mrdimm-brief]

  - id: arc-pro-b60
    name: Intel Arc Pro B60
    category: GPU
    segment: Workstation / departmental
    status: available
    example_sku: Arc Pro B60 (partner-branded cards)
    key_facts:
      - "24 GB GDDR6, 192-bit, up to 456 GB/s."
      - "20 Xe-cores, 160 XMX engines (Xe2-HPG)."
      - "PCIe 5.0 x16 connector, x8 electrical."
      - "120-200 W TBP (Intel reference; partner designs vary)."
    ai_role: Inference of models that fit in 24 GB per card; multi-card workstation setups.
    software: [Intel GPU driver, Level Zero / OpenCL, PyTorch XPU, OpenVINO GPU, vLLM XPU backend]
    tpm_notes: "Codename check: \"B60\" maps to the commercial Arc Pro B60 per Intel's datasheet. Intel-branded version is not for sale; partner cards vary."
    caveats: Partner board power and cooling vary; confirm the exact partner card.
    sources: [arc-pro-b60-datasheet, pytorch-xpu-get-started, vllm-gpu-install]

