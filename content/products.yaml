    key_facts:
      - "128 GB HBM2e, 3.7 TB/s (HL-338 and HL-325L)."
      - "HL-338 PCIe: 8 MME, 64 TPC, 96 MB SRAM, 600 W, air-cooled, double-width."
      - "HL-325L OAM: 24 x 200 GbE RoCE v2 ports, up to 900 W."
      - "Data types listed: FP8, BF16, FP16, TF32, FP32."
    ai_role: Large-model training and inference with integrated Ethernet scale-out.
    software: [Gaudi firmware + driver, Intel Gaudi software (1.24.2 on check date), PyTorch (2.13 for 1.24.2), vllm-gaudi plugin]
