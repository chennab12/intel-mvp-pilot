# Source registry. Every product-specific claim in the app points at one of these ids.
#
# Fields
#   title, publisher, url  where the claim comes from
#   kind       official | upstream | paper | third-party | original
#   checked    the date a person or tool actually opened the page (YYYY-MM-DD), or null if never checked
#   status     available | announced | historical | deprecated | unverified | concept
#   product    exact product or family the source covers (or "n/a")
#   version    hardware/software version the source applies to, when relevant
#   facts      the specific facts the app relies on (short, as read on the page)
#   review_by  date this entry should be re-checked (manual review workflow, see README)
#
# Rule: never set `checked` to a date unless the page was actually opened on that date.
# If a claim cannot be checked, set checked: null and status: unverified, and the app shows
# "Needs verification".

sources:
  intel-amx-overview:
    title: Intel Advanced Matrix Extensions (Intel AMX) overview
    publisher: Intel
    url: https://www.intel.com/content/www/us/en/products/docs/accelerator-engines/advanced-matrix-extensions/overview.html
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel AMX on Intel Xeon processors
    version: 4th Gen Intel Xeon Scalable and later (page names 4th Gen explicitly)
    facts:
      - AMX is a built-in accelerator on Xeon that improves deep-learning training and inference on the CPU.
      - Accelerator availability varies by SKU.
      - The page does not list data types; check the specific SKU on Intel ARK.
    review_by: 2027-04-20

  ark-xeon-696x:
    title: Intel Xeon 696X Processor (336M Cache, 2.40 GHz) specifications
    publisher: Intel ARK
    url: https://www.intel.com/content/www/us/en/products/sku/243860/intel-xeon-696x-processor-336m-cache-2-40-ghz/specifications.html
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel Xeon 6 processors (formerly Granite Rapids), SKU Xeon 696X
    version: launch Q1'26 per ARK
    facts:
      - 64 Performance-cores, 128 threads, 336 MB cache.
      - Memory DDR5 6400 MT/s or MRDIMM 8000 MT/s, 8 memory channels.
      - PCIe 5.0, 128 lanes; TDP 350 W.
      - Intel AMX listed as Yes; instruction sets include AVX2, AVX-512 and AMX.
    review_by: 2027-04-20

  intel-xeon6-mrdimm-brief:
    title: Intel Xeon 6 processors with MRDIMM solution brief
    publisher: Intel
    url: https://www.intel.com/content/www/us/en/content-details/919018/intel-xeon-6-processors-with-mrdimm-solution-brief.html
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel Xeon 6 platforms with MRDIMM
    version: n/a
    facts:
      - Vendor claim: memory bandwidth "up to 8800 MT/s"; configurations reaching it are not listed on the page.
      - Vendor claims of higher bandwidth / lower latency vs unnamed competitors; baseline and workload not given on the page.
    review_by: 2027-04-20

  arc-pro-b60-datasheet:
    title: Intel Arc Pro B60 GPU datasheet
    publisher: Intel
    url: https://www.intel.com/content/dam/www/central-libraries/us/en/documents/2026-03/datasheet-b60-gpu.pdf
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel Arc Pro B60 (Xe2-HPG, Battlemage family)
    version: datasheet dated 2026-03 folder
    facts:
      - 24 GB GDDR6 on a 192-bit interface, up to 456 GB/s.
      - 20 Xe-cores, 160 XMX AI engines.
      - PCIe 5.0 x16 connector (x8 electrical), Gen 4 backward compatible.
      - 120-200 W total board power (Intel reference; partner designs vary).
      - Sold as partner-branded cards; the Intel-branded version is not for sale.
      - Software listed includes oneAPI, OpenCL 3.0 and OpenVINO; OS Windows 10/11 and Linux (Ubuntu).
    review_by: 2027-04-20

  ark-arc-pro-b70:
    title: Intel Arc Pro B70 Graphics specifications
    publisher: Intel ARK
    url: https://www.intel.com/content/www/us/en/products/sku/245797/intel-arc-pro-b70-graphics/specifications.html
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel Arc Pro B70 (products formerly Battlemage)
    version: launch Q1'26, marketing status Launched
    facts:
      - 32 GB GDDR6, 256-bit, 608 GB/s.
      - 32 Xe-cores, 256 XMX engines.
      - TBP 230 W (range 160-290 W); PCIe 5.0 x16.
    review_by: 2027-04-20

  gaudi3-pcie-brief:
    title: Intel Gaudi 3 AI Accelerator HL-338 PCIe add-in card product brief
    publisher: Intel
    url: https://cdrdv2-public.intel.com/817488/Gaudi%203%20PCIe%20Product%20Brief_RB_1_V6.pdf
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel Gaudi 3 HL-338 PCIe card
    version: product brief RB_1_V6
    facts:
      - 128 GB HBM2e, 3.7 TB/s peak bandwidth; 96 MB on-die SRAM.
      - 8 MME engines and 64 Tensor Processor Cores (TPCs).
      - PCIe 5.0 x16 host interface; card TDP 600 W, air-cooled, double-width.
      - Software is Intel Gaudi software, integrating with PyTorch, vLLM and Hugging Face.
    review_by: 2027-04-20

  gaudi3-oam-brief:
