  gaudi-driver-install:
    title: Intel Gaudi driver and software installation
    publisher: Intel Gaudi documentation
    url: https://docs.habana.ai/en/latest/Installation_Guide/Driver_Installation.html
    kind: official
    checked: 2026-10-20
    status: available
    product: Intel Gaudi software
    version: page covers 1.24.2
    facts:
      - Installed with habanalabs-installer.sh.
      - habanalabs-container-runtime is required for containers and is not installed automatically.
      - Docker and Kubernetes are supported; CPU settings must be set on bare metal before starting a container.
      - The hl-smi tool reports device indexes.
    review_by: 2027-01-20

  vllm-gaudi-repo:
    title: vLLM Hardware Plugin for Intel Gaudi (vllm-gaudi)
    publisher: vLLM project (GitHub)
    url: https://github.com/vllm-project/vllm-gaudi
    kind: upstream
    checked: 2026-10-20
    status: available
    product: vLLM on Intel Gaudi
    version: plugin 0.26.0 (2026/08) with Intel Gaudi 1.24.1 and PyTorch 2.11
    facts:
      - Community-maintained plugin using vLLM's hardware-pluggable architecture.
      - Each plugin release is built on a specific vLLM version; upstream API changes can break compatibility.
    review_by: 2027-01-20

  vllm-gpu-install:
    title: vLLM GPU installation (Intel XPU section)
    publisher: vLLM documentation
    url: https://docs.vllm.ai/en/latest/getting_started/installation/gpu.html
    kind: upstream
    checked: 2026-10-20
    status: available
    product: vLLM on Intel Data Center GPU and Intel Arc GPU (XPU)
    version: docs "latest" as of check date
    facts:
      - Lists Intel Data Center GPU and Intel Arc GPU for the XPU backend; Linux only.
      - vllm-xpu-kernels wheel requires Python 3.12.
      - Install the Intel GPU driver first; build from source with VLLM_TARGET_DEVICE=xpu or use nightly XPU wheels.
    review_by: 2027-01-20

  vllm-bench-cli:
    title: vLLM benchmark CLI (vllm bench serve)
    publisher: vLLM documentation
    url: https://docs.vllm.ai/en/latest/benchmarking/cli.html
    kind: upstream
    checked: 2026-10-20
    status: concept
    product: vLLM benchmarking tools
    version: docs "latest" as of check date
    facts:
      - Reports TTFT, TPOT, ITL and end-to-end latency with mean, median and P99.
      - TPOT = (end-to-end latency - TTFT) / (output tokens - 1), per request.
      - Reports request throughput, output token throughput and total token throughput.
    review_by: 2027-04-20

  pytorch-xpu-get-started:
    title: Getting Started on Intel GPU (PyTorch)
    publisher: PyTorch documentation
    url: https://docs.pytorch.org/docs/main/notes/get_start_xpu.html
    kind: upstream
    checked: 2026-10-20
    status: available
    product: PyTorch XPU backend for Intel GPUs
    version: docs "main" as of check date
    facts:
      - Supported data center hardware listed - Intel Data Center GPU Max Series (Ponte Vecchio).
      - Supported client hardware listed - Arc A-Series, Arc B-Series, Core Ultra with Arc Graphics (Meteor Lake-H, Arrow Lake-H, Lunar Lake, Panther Lake).
      - Install with the XPU wheel index (download.pytorch.org/whl/xpu); check with torch.xpu.is_available().
      - If it prints False, double check the Intel GPU driver installation.
    review_by: 2027-01-20

